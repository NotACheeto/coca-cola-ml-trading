[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coca-cola-ml-trading"
version = "0.1.0"
description = "Machine learning quantitative trading framework for Coca-Cola ($KO) based on competitor, supplier, and sector dynamics."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Antigravity Quant Systems" }
]
dependencies = [
    "yfinance>=1.8.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
    "pyarrow>=14.0.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
